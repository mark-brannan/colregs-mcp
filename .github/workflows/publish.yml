name: Publish

# Publishes to npm using OIDC trusted publishing: npm verifies this workflow's
# short-lived, workflow-scoped identity, so there is no npm token to store,
# rotate, or leak. Provenance attestations are generated automatically.
#
# Prerequisite, done once on npmjs.com: package settings -> Trusted publishers
# -> GitHub Actions, with repository mark-brannan/colregs-mcp and workflow
# file `publish.yml`. Until that exists this workflow will fail
# authentication, which is the correct failure mode. The first publish of
# colregs-mcp was done by hand from an authenticated session (`npm publish`)
# before this workflow existed, per npm/cli#8544: trusted publishing can't
# create a name that doesn't exist yet.
#
# Same pattern as mark-brannan/colregs-engine's publish.yml -- see that
# repo's copy for the fuller rationale.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (dispatch from main); omit when dispatching with --ref <tag>
        required: false
  # Deliberately no `push: tags` trigger. release-please.yml tags through a
  # GitHub App installation token (not the default GITHUB_TOKEN), so that
  # push DOES fire workflows -- and a `push: tags` listener here would start
  # a second, racing publish alongside the explicit `gh workflow run
  # publish.yml --ref <tag>` dispatch release-please.yml already does.
  # workflow_dispatch is also the only trigger npm's OIDC trusted publisher
  # is configured for on npmjs.com (this file, this repo). So a tag alone,
  # pushed by hand, does not publish; run `gh workflow run publish.yml --ref
  # vX.Y.Z` instead.

permissions:
  contents: read # release-please.yml creates the tag/Release; this workflow only reads the tag
  id-token: write # required: this is what mints the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_dispatch can target a branch, not just a tag. A branch named
    # to match package.json's version (e.g. "v0.0.2") would pass the tag
    # check below despite not being an actual release tag -- npm trusted
    # publishing doesn't restrict which ref a workflow_dispatch can run on.
    # Refusing anything but a real tag closes that.
    if: github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && inputs.tag != '')
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1, newer than what ships with
      # Node 22.
      - run: npm install -g npm@11 # 12 refuses git dependencies by default (EALLOWGIT)

      - name: Refuse to publish a tag that disagrees with package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Before `npm publish`, because everything below this line is
      # irreversible: a version that has been pushed to npm and to the MCP
      # registry cannot be taken back, so a manifest that fails schema
      # validation must fail the release while there is still nothing to undo.
      # The bundle is no longer built or attached here: the Claude directory
      # takes a plugin bundle read from the repo (colregs-mcp#58), and Smithery's
      # upload is built by hand (docs/releasing.md).
      - name: Install mcpb and validate the manifest
        run: |
          npm install -g @anthropic-ai/mcpb
          mcpb validate .

      # No NODE_AUTH_TOKEN -- authentication is the OIDC identity above.
      #
      # Skipped when this exact version is already on npm. npm refuses to
      # republish a version, and a tag published by hand (the first
      # publish, or one made while the trusted publisher was not yet
      # registered on npmjs.com) must still get its MCP registry entry
      # from the steps below, which only this workflow
      # does. npm is the system of record for "published"; the registry step
      # then checks the tarball itself.
      - name: Publish to npm unless this version is already there
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "colregs-mcp@${PKG}" version >/dev/null 2>&1; then
            echo "colregs-mcp@${PKG} is already on npm; skipping npm publish"
          else
            npm publish
          fi

      # The official MCP registry, immediately after npm and from the same
      # tag, so a version can never exist in one and not the other. The
      # registry validates that the npm tarball it is pointed at carries an
      # `mcpName` matching server.json's `name`, which is why that key is in
      # package.json; publishing to the registry before npm would fail that
      # check. `login github-oidc` uses the same id-token permission npm's
      # trusted publishing does -- no stored secret, and the GitHub identity
      # is what restricts the name to the `io.github.mark-brannan/` namespace.
      #
      # server.json's two version fields are kept in step with package.json by
      # release-please's extra-files, so no step here rewrites them.
      #
      # The registry fetches the tarball from npm itself and answers 400 "was
      # not found" for a short while after `npm publish` returns, so retry that
      # one call, bounded, on that error only.
      - name: Publish to the MCP registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          set -o pipefail
          for i in $(seq 1 12); do
            if ./mcp-publisher publish 2>&1 | tee publish.log; then
              exit 0
            fi
            grep -q "was not found" publish.log || exit 1
            echo "not yet visible to the registry (attempt $i/12); waiting"
            sleep 15
          done
          exit 1
